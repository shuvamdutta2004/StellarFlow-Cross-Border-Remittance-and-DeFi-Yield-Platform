name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_STELLAR_NETWORK: testnet
  NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
  NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
  NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
  NEXT_PUBLIC_REMITTANCE_ROUTER_CONTRACT_ID: CB73XRZ6K7O3VJH5G7Y6Y5N2L6A8K4M1N9P2Q5R8S1T4U7V0W3X6Y9Z2
  NEXT_PUBLIC_YIELD_VAULT_CONTRACT_ID: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
  NEXT_PUBLIC_SAVINGS_GOAL_CONTRACT_ID: CANWI4UO2NHX3PJD6VDSHTXJHNPRBATL5VRBDCNQATUQW2LUWF4YM4JP
  NEXT_PUBLIC_TREASURY_WALLET_ADDRESS: GDSFFHT4YTWUFV4GI7KROZPPLN5LEEJPUR24HTO4BDJPGZVPV3PPKIOG

jobs:
  # ── Frontend CI ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Lint + Build + Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest frontend tests
        run: npm run test

      - name: Build Next.js application
        run: npm run build

  # ── Smart Contract CI ────────────────────────────────────────────────────────
  contract:
    name: Smart Contract (Rust Cargo Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run contract unit tests
        run: |
          cargo test --manifest-path contracts/remittance_router/Cargo.toml
          cargo test --manifest-path contracts/yield_vault/Cargo.toml
          cargo test --manifest-path contracts/savings_goal/Cargo.toml
        env:
          RUST_BACKTRACE: 1
