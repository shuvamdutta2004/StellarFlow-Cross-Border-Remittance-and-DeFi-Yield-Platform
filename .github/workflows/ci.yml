name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_STELLAR_NETWORK: testnet
  NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
  NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
  NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
  NEXT_PUBLIC_REMITTANCE_ROUTER_CONTRACT_ID: CCCOM4GDC6VFLEPG2AN7NSSUMVYXUDEWSNL5DNFZZOCNBWN3XU3AURYC
  NEXT_PUBLIC_YIELD_VAULT_CONTRACT_ID: CBMFYE434L3XK4XSTFDXRPABU3KOFRFOKABEUOGTCGTPGLASYB2GF4LA
  NEXT_PUBLIC_SAVINGS_GOAL_CONTRACT_ID: CAGIFCUOWD3W4QMWMK2ZLZNYJOLF6HHNQ4K2UGFQGB7MXUSLOWDVWVS2
  NEXT_PUBLIC_TREASURY_WALLET_ADDRESS: GDSFFHT4YTWUFV4GI7KROZPPLN5LEEJPUR24HTO4BDJPGZVPV3PPKIOG
  NEXT_PUBLIC_DEPLOYER_WALLET_ADDRESS: GC45MTVQ7DZJ2JAEVQWXJ5BNO4DY6AXEZSBGL7RVUKOOG7GXREV73VGW

jobs:
  # ── Frontend CI ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Lint + Build + Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest frontend tests
        run: npm run test

      - name: Build Next.js application
        run: npm run build

  # ── Smart Contract CI ────────────────────────────────────────────────────────
  contract:
    name: Smart Contract (Rust Cargo Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build & Verify Smart Contracts (WASM Target)
        run: |
          cargo build --target wasm32-unknown-unknown --release
        env:
          RUST_BACKTRACE: 1
